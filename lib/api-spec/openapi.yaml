openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Break Buddy API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: teams
    description: Team management
  - name: breaks
    description: Break tracking
  - name: payments
    description: Mercado Pago payment flow
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users:
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Bad request

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found

  /users/{userId}/stats:
    get:
      operationId: getUserStats
      tags: [users]
      summary: Get user's break stats (today and this week)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStats"
        "404":
          description: Not found

  /teams:
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a new team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          description: Bad request

  /teams/join:
    post:
      operationId: joinTeam
      tags: [teams]
      summary: Join a team using an invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamJoinInput"
      responses:
        "200":
          description: Team joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          description: Bad request
        "404":
          description: Team not found

  /teams/{teamId}:
    get:
      operationId: getTeam
      tags: [teams]
      summary: Get team info
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          description: Not found

  /teams/{teamId}/logo:
    patch:
      operationId: patchTeamLogo
      tags: [teams]
      summary: Update the team logo URL
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamLogoInput"
      responses:
        "200":
          description: Logo updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateTeamLogoResponse"
        "400":
          description: Bad request
        "403":
          description: Forbidden
        "404":
          description: Team not found

  /teams/{teamId}/leaderboard:
    get:
      operationId: getTeamLeaderboard
      tags: [teams]
      summary: Get weekly leaderboard for a team
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leaderboard"
        "404":
          description: Not found

  /payments/create:
    post:
      operationId: createPayment
      tags: [payments]
      summary: Create a Mercado Pago preference for team creation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCreateInput"
      responses:
        "201":
          description: Preference created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCreateResponse"
        "400":
          description: Bad request

  /payments/{token}/status:
    get:
      operationId: getPaymentStatus
      tags: [payments]
      summary: Poll payment status by token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: mpPreapprovalId
          in: query
          required: false
          schema:
            type: string
            nullable: true
      responses:
        "200":
          description: Payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatusResponse"
        "404":
          description: Not found

  /breaks:
    post:
      operationId: logBreak
      tags: [breaks]
      summary: Log a completed break
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BreakInput"
      responses:
        "201":
          description: Break logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakEntry"
        "400":
          description: Bad request

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        teamId:
          type: ["integer", "null"]
        teamName:
          type: ["string", "null"]
        createdAt:
          type: string

    UserInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50

    UserStats:
      type: object
      required: [userId, todayBreaks, weeklyBreaks, todayHydration, weeklyHydration]
      properties:
        userId:
          type: integer
        todayBreaks:
          type: integer
        weeklyBreaks:
          type: integer
        todayHydration:
          type: integer
        weeklyHydration:
          type: integer

    Team:
      type: object
      required: [id, name, inviteCode, createdAt, memberCount, plan, subscriptionStatus, nearMemberLimit]
      properties:
        id:
          type: integer
        name:
          type: string
        inviteCode:
          type: string
        createdAt:
          type: string
        memberCount:
          type: integer
        plan:
          type: string
        subscriptionStatus:
          type: string
        logoUrl:
          type: ["string", "null"]
        nearMemberLimit:
          type: boolean

    TeamInput:
      type: object
      required: [name, paymentToken]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        paymentToken:
          type: string

    PaymentCreateInput:
      type: object
      required: [plan]
      properties:
        plan:
          type: string

    PaymentCreateResponse:
      type: object
      required: [paymentToken, checkoutUrl, amountArs]
      properties:
        paymentToken:
          type: string
        checkoutUrl:
          type: string
        amountArs:
          type: integer

    PaymentStatusResponse:
      type: object
      required: [paymentToken, status]
      properties:
        paymentToken:
          type: string
        status:
          type: string
        mpPaymentId:
          type: ["string", "null"]

    TeamJoinInput:
      type: object
      required: [inviteCode]
      properties:
        inviteCode:
          type: string

    LeaderboardMember:
      type: object
      required: [userId, name, weeklyBreaks, todayBreaks, weeklyHydration, rank]
      properties:
        userId:
          type: integer
        name:
          type: string
        weeklyBreaks:
          type: integer
        todayBreaks:
          type: integer
        weeklyHydration:
          type: integer
        rank:
          type: integer
        medal:
          type: ["string", "null"]

    Leaderboard:
      type: object
      required: [teamId, teamName, weekStart, members]
      properties:
        teamId:
          type: integer
        teamName:
          type: string
        weekStart:
          type: string
        members:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardMember"
        logoUrl:
          type: ["string", "null"]

    UpdateTeamLogoInput:
      type: object
      required: [logoUrl]
      properties:
        logoUrl:
          type: string

    UpdateTeamLogoResponse:
      type: object
      required: [logoUrl]
      properties:
        logoUrl:
          type: string

    BreakEntry:
      type: object
      required: [id, userId, breakType, completedAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        breakType:
          type: string
        completedAt:
          type: string

    BreakInput:
      type: object
      required: [userId, breakType]
      properties:
        userId:
          type: integer
        breakType:
          type: string
